<aside class="news-panel">
<h4 class="section-label">News</h4>

<ul class="news-feed">
{% for article in site.data.news limit:9 %}
<li>
  <span class="news-date">{{ article.date }}</span>
  <span class="news-text">{{ article.headline | markdownify | remove: '<p>' | remove: '</p>' }}</span>
</li>
{% endfor %}
</ul>

<h4 class="news-more"><a href="{{ site.url }}{{ site.baseurl }}/utlnews/">... see all News</a></h4>

</aside>
