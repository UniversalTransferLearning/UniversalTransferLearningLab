{% assign album = include.activity %}
<figure class="gallery-card" id="carousel-{{ album.id }}">
  <div class="gallery-strip" aria-label="{{ album.title | escape }} photos" role="group"{% if album.photos.size > 1 %} tabindex="0"{% endif %}>
    {% for photo in album.photos %}
    <img class="gallery-photo" {% include display_src.html photo=photo sizes="(max-width: 767px) calc(100vw - 50px), (max-width: 1120px) calc(50vw - 39px), 521px" %} width="600" height="400" alt="{{ album.title | escape }}, photo {{ forloop.index }} of {{ forloop.length }}" loading="lazy" decoding="async">
    {% endfor %}
  </div>
  <figcaption>
    <h3>{{ album.title | escape }}</h3>
    <p>{{ album.description | escape }}</p>
  </figcaption>
</figure>
